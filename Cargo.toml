[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/session", "crates/relay", "crates/client", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tracing = "0.1"

openmls = "0.9.2"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"

messenger-protocol = { path = "crates/protocol" }
messenger-core = { path = "crates/core" }
messenger-session = { path = "crates/session" }
messenger-relay = { path = "crates/relay" }

# Small and fast WebAssembly for the web app:
#   cargo build -p messenger-wasm --target wasm32-unknown-unknown --profile wasm-release
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
