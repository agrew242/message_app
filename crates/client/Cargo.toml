[package]
name = "messenger-client"
description = "Native client: talks to the relay over HTTP, keeps state encrypted on disk, and drives the encryption core. Used by the command-line tool and the Phase 0 tests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "msg"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
messenger-core.workspace = true
messenger-protocol.workspace = true
rand.workspace = true
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
messenger-relay.workspace = true
tempfile = "3"
