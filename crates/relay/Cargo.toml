[package]
name = "messenger-relay"
description = "The relay server: key directory, short-lived encrypted mailboxes and per-chat ordering. It never decrypts anything."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex.workspace = true
messenger-protocol.workspace = true
p256 = { version = "0.13", features = ["ecdsa"] }
rand.workspace = true
reqwest = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
