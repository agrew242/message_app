[package]
name = "messenger-wasm"
description = "The shared session compiled to WebAssembly for the web app: one Messenger class, JSON in and out, the browser's fetch for the network."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
messenger-session.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# In the browser there's no system clock or random source for Rust's
# standard library; these features point the crypto crates at JavaScript's.
openmls = { workspace = true, features = ["js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
